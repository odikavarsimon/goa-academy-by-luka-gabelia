<!--transform არის CSS თვისება, რომელიც გამოიყენება ელემენტის გადაადგილებისთვის, მოტრიალებისთვის ზომის შესაცვლელად და დახრისთვის ისე რომ შეგვიძლია შევცვალოთ მისი ვიზუალური მდებარეობა და ფორმა transform-ის შესაძლო მნიშვნელობებია
translate() — ელემენტის გადაადგილება.
rotate() — ელემენტის მოტრიალება.
scale() — ელემენტის ზომის გაზრდა ან შემცირება.
skew() — ელემენტის დახრა.
matrix() — რამდენიმე გარდაქმნის ერთდროულად შესრულება.

ასევე შეგვიძლია გამოვიყენოთ:
translateX() — ჰორიზონტალურად გადაადგილება.
translateY() — ვერტიკალურად გადაადგილება.
scaleX() — სიგანის შეცვლა.
scaleY() — სიმაღლის შეცვლა.
rotateX() — X ღერძის გარშემო მოტრიალება.
rotateY() — Y ღერძის გარშემო მოტრიალება.
rotateZ() — Z ღერძის გარშემო მოტრიალება.-->
